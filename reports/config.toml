[access]
help = "Reports about user and role access to target hosts and accounts"
description = """\
Reports about user and role access to target hosts and accounts.

Subcommands:
  account               List who can access a specified account on a target
  account-restrictions  List target accounts having command restrictions
  hosts                 List all target hosts a specified user can access
  query                 Query host access by various filters
  role-map              List roles that can access a target host
"""

[connections]
help = "Connection reports"
description = """\
Various connection reports.

Subcommands:
  details   Get connection details by ID
  query     Query connections by various filters (requires a date range)
  query-db  Query connections from sync server database by various filters (requires a date range)
"""

[events]
help = "Audit event reports."
description = """\
Report audit events by date range and event code.
Reports are generated on event data synced to the database.

Subcommands:
  query                 Generic event query
  role-member           Role member additions and removals
  account               Target account additions and removals
"""

[list]
help = "List various PrivX entities"
description = """\
List various PrivX entities.

Subcommands:
  access-groups    List all access groups
  local-users      List all local users
  hosts            List all hosts
  network-targets  List all network targets
  api-targets      List all API targets
  roles            List all roles
  secrets          Query secrets by name or role
  sources          PrivX user directories and host directories
"""

[roles]
help = "Reports about roles, their members and restrictions"
description = """\
Reports about roles, their members and restrictions.

Subcommands:
  members       List all members of a role
  query         Query roles by various filters
  restrictions  List roles having contextual restrictions
  user          List all roles assigned to a user
"""

[access.subcommands.account]
help = "List who can access specified account on target. Provide either --target-address or --common-name to identify the host."

[access.subcommands.account.options.target_address]
