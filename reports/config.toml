[access.subcommands.hosts]
help = """List all target hosts a specified user can access for each assigned role.
At least one of --user-name, --user-id, or --principal is required."""

[access.subcommands.hosts.options.user_name]
flags = ["--user-name"]
required = false
help = """Filter by exact user full name (case-insensitive exact match).
Examples: "Jane Doe" (matches only "Jane Doe", not "Jane Doe Admin")"""

[access.subcommands.hosts.options.user_id]
flags = ["--user-id"]
