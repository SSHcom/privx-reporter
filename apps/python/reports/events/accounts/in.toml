[events.subcommands.accounts]
help = """Query account addition and removal events (from db).
Date range will always be applied. Default range is the last 7 days.
With --json-source, one source record may include multiple account changes."""

[events.subcommands.accounts.options.from_date]
flags = ["--from-date"]
required = false
type = "date"
help = "From date in YYYY-MM-DD or ISO 8601 format."

[events.subcommands.accounts.options.to_date]
flags = ["--to-date"]
required = false
type = "date"
help = "To date (inclusive) in YYYY-MM-DD or ISO 8601 format."

[events.subcommands.accounts.options.days]
flags = ["--days"]
required = false
help = "Number of days in the past (max 30, overrides from and to dates)"

[events.subcommands.accounts.options.added]
flags = ["--added"]
required = false
action = "store_true"
help = "Show only account additions."

[events.subcommands.accounts.options.removed]
flags = ["--removed"]
required = false
action = "store_true"
help = "Show only account removals."

[events.subcommands.accounts.options.json_source]
flags = ["--json-source"]
required = false
action = "store_true"
help = "Output as original JSON. Overrides JSON checkbox or --to-json CLI flag."
