[events.subcommands.role-members]
help = """Query role member addition and removal events (from db).
Date range will always be applied. Default range is the last 7 days."""

[events.subcommands.role-members.options.from_date]
flags = ["--from-date"]
required = false
type = "date"
help = "From date in YYYY-MM-DD or ISO 8601 format."

[events.subcommands.role-members.options.to_date]
flags = ["--to-date"]
required = false
type = "date"
help = "To date (inclusive) in YYYY-MM-DD or ISO 8601 format."

[events.subcommands.role-members.options.days]
flags = ["--days"]
required = false
help = "Number of days in the past (max 30, overrides from and to dates)"

[events.subcommands.role-members.options.added]
flags = ["--added"]
required = false
action = "store_true"
help = "Show only role member additions."

[events.subcommands.role-members.options.removed]
flags = ["--removed"]
required = false
action = "store_true"
help = "Show only role member removals."