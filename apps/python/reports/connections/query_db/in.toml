[connections.subcommands.query-db]
help = """Query connections by various filters. Defaults to last 7 days if no date range is specified.\n
Note: This report is based on historical records from the database.
"""

[connections.subcommands.query-db.options.from_date]
flags = ["--from-date"]
required = true
type = "date"
help = "From date in YYYY-MM-DD or ISO 8601 format."

[connections.subcommands.query-db.options.to_date]
flags = ["--to-date"]
required = true
type = "date"
help = "To date (inclusive) in YYYY-MM-DD or ISO 8601 format."

[connections.subcommands.query-db.options.target_account]
flags = ["--target-account"]
required = false
help = "Filter by target host account"

[connections.subcommands.query-db.options.user_name]
flags = ["--user-name"]
required = false
help = "Filter by user name (case-insensitive substring match)."

[connections.subcommands.query-db.options.target_address]
flags = ["--target-address"]
required = false
help = "Filter by target host address"

[connections.subcommands.query-db.options.connection_type]
flags = ["--connection-type"]
required = false
help = "Filter by connection type (e.g., SSH, RDP, API)"
