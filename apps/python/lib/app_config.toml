optional = true
order = 20

[sections.oidc_global.vars.OIDC_AUTO_PROVISION_REQUIRE_EMAIL]
label = "Require email claim"
description = "Reject auto-provision when the IdP token has no email."
type = "boolean"
widget = "checkbox"
default = "false"
validate = "bool"
order = 30

[sections.oidc_global.vars.OIDC_AUTO_PROVISION_ALLOWED_EMAIL_DOMAINS]
label = "Allowed email domains"
description = "Comma-separated allowlist; empty allows all domains when email is required."
type = "csv"
widget = "text"
default = ""
optional = true
order = 40

[sections.oidc_global.vars.OIDC_GROUP_CLAIM]
label = "Group claim path"
description = "Claim path for IdP groups, e.g. groups or realm_access.roles."
type = "string"
widget = "text"
default = "groups"
optional = true
order = 50

[sections.oidc_global.vars.OIDC_GROUP_MAPPING]
label = "Group mapping (JSON)"
description = "Maps IdP group values to Reporter user groups, e.g. {\"idp-admin\":\"admin\"}."
type = "json"
widget = "textarea"
default = "{}"
validate = "json_object"
optional = true
order = 60

