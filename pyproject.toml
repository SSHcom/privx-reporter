[project]
name = "reporter-privx-dev"
version = "1.0.2"
description = "PrivX reporting service with PostgreSQL (TimescaleDB) sync"
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "privx_api @ git+https://github.com/SSHcom/privx-sdk-for-python.git@bdbab0eb2e5e3bf1a4b9952478f4965d9305c891",
    "watchdog>=3.0.0",
    "toml>=0.10.2",
    "types-toml>=0.10.8.20240310",
    "pandas>=2.3.3",
    "streamlit>=1.56.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.10",
    "bcrypt>=5.0.0",
    "matplotlib>=3.10.8",
    "streamlit-extras>=1.3.0",
    "python-dotenv>=1.2.1",
    "requests>=2.33.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
create-env = "lib.interactive.env._create_env:main"
sync-server = "sync_server.main:main"
sync-server-live-test = "live_test.main:main"
backup-server = "backup_server.main:main"
report = "lib._report.main:main"
admin = "lib._admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable/dev installs: apps/python packages + root live_test/.
dev-mode-dirs = ["apps/python", "."]

[tool.hatch.build.targets.wheel.force-include]
"apps/python/lib" = "lib"
"apps/python/sync_server" = "sync_server"
"apps/python/backup_server" = "backup_server"
"apps/python/reports" = "reports"
"apps/python/administration" = "administration"
# live_test is imported from the repo root via dev-mode-dirs / _reporter_privx_dev.pth (not vendored here).

[dependency-groups]
dev = [
    "python-dotenv[cli]>=1.2.1",
    "ruff>=0.14.9",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 120
# First-party import roots (isort); lint/format targets are set in Taskfile and CI.
src = ["apps/python", "live_test"]
extend-exclude = [
    "apps/go",
    "release",
    "bin",
    "docs",
    "security-report",
    ".github",
    ".cursor",
    ".todos",
    ".vscode",
    "ui/custom/cookie/frontend",
]

[tool.ruff.lint]
# Enable stricter type-related linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "TCH", # flake8-type-checking
    "PYI", # flake8-pyi (for stub files)
]

ignore = ["I001"]
# For strict type checking, use mypy (configured below)

[tool.mypy]
# Strict type checking configuration
python_version = "3.13"
# Prefer monorepo sources over the editable install in .venv (see dev-mode-dirs).
mypy_path = "apps/python"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
show_error_codes = true
# Same packages as pre-layout mypy (lib, reports, sync_server), under apps/python/.
files = [
    "apps/python/lib",
    "apps/python/reports",
    "apps/python/sync_server",
]

# Module-specific overrides
[[tool.mypy.overrides]]
module = [
    "privx_api.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Python tests mirror apps/python/ under tests/python/.
pythonpath = ["apps/python", "."]
testpaths = ["tests/python"]
norecursedirs = [".git", "node_modules", "__pycache__", "apps"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "database: Tests requiring local database test container",
]

[tool.coverage.run]
source_pkgs = [
    "lib",
    "sync_server",
    "reports",
    "administration",
    "backup_server",
    "ui",
    "live_test",
]

[tool.coverage.report]
show_missing = true

