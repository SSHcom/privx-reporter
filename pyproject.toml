[project]
name = "reporter-privx-dev"
version = "1.0.0"
description = "PrivX reporting service with PostgreSQL (TimescaleDB) sync"
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "privx_api @ git+https://github.com/SSHcom/privx-sdk-for-python.git@bdbab0eb2e5e3bf1a4b9952478f4965d9305c891",
    "watchdog>=3.0.0",
    "toml>=0.10.2",
    "types-toml>=0.10.8.20240310",
    "pandas>=2.3.3",
    "streamlit>=1.56.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.10",
    "bcrypt>=5.0.0",
    "matplotlib>=3.10.8",
    "streamlit-extras>=1.3.0",
    "python-dotenv>=1.2.1",
    "requests>=2.33.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
create-env = "lib.interactive.env._create_env:main"
sync-server = "sync_server.main:main"
sync-server-live-test = "live_test.main:main"
report = "lib._report.main:main"
admin = "lib._admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "sync_server", "live_test", "reports", "administration"]

[dependency-groups]
dev = [
    "python-dotenv[cli]>=1.2.1",
    "ruff>=0.14.9",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable stricter type-related linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "TCH", # flake8-type-checking
    "PYI", # flake8-pyi (for stub files)
]

ignore = ["I001"]
# For strict type checking, use mypy (configured below)

[tool.mypy]
# Strict type checking configuration
python_version = "3.13"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
show_error_codes = true

# Module-specific overrides
[[tool.mypy.overrides]]
module = [
    "privx_api.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "database: Tests requiring local database test container",
]

